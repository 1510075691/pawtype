<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>PawType 宠格测试 · 读懂你的毛孩子</title>
  <meta name="description" content="免费宠物性格测试，猫狗各36道观察题，测出16种宠格，读懂你家毛孩子的小世界。">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <canvas id="celeb-canvas"></canvas>

  <!-- ============ 首页 ============ -->
  <div id="screen-home" class="screen active">
    <div class="home-wrap">
      <div class="logo">🐾 PawType</div>
      <div class="home-pet-3d">🐱🐶</div>
      <h1 class="home-title">读懂毛孩子的<br>16 种小性格</h1>
      <p class="home-sub">它喜欢热闹还是安静？好奇还是恋家？<br>用几分钟观察题，测出你家猫猫狗狗的专属宠格。</p>

      <div class="species-select">
        <button class="species-btn" data-species="cat">
          <span class="species-emoji">🐱</span>
          <span class="species-name">猫咪版</span>
          <span class="species-note">36 题 · 约 3 分钟</span>
        </button>
        <button class="species-btn" data-species="dog">
          <span class="species-emoji">🐶</span>
          <span class="species-name">狗狗版</span>
          <span class="species-note">36 题 · 约 3 分钟</span>
        </button>
      </div>

      <div class="pet-name-box">
        <label for="pet-name">它的名字（可选）</label>
        <input id="pet-name" type="text" maxlength="12" placeholder="比如：豆豆 / 咪咪">
      </div>

      <button id="btn-start" class="primary-btn" disabled>开始测试</button>
      <p class="home-tip">免费 · 无需注册 · 结果页可解锁完整报告</p>
    </div>
  </div>

  <!-- ============ 答题页 ============ -->
  <div id="screen-quiz" class="screen">
    <div class="quiz-top">
      <button id="btn-back" class="back-btn">‹</button>
      <div class="progress-bar"><div id="progress-fill" class="progress-fill"></div></div>
      <span id="progress-text" class="progress-text">1/36</span>
    </div>
    <div id="quiz-body" class="quiz-body"></div>
  </div>

  <!-- ============ 结果页 ============ -->
  <div id="screen-result" class="screen">
    <div class="result-wrap" id="result-wrap"></div>
  </div>

  <script src="types.js"></script>
  <script src="questions.js"></script>
  <script src="config.js"></script>
  <script src="fx.js"></script>
  <script src="app.js"></script>
</body>
</html>
