<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>报告对照表（运营用）</title>
  <style>
    :root { --bg:#FFF7F0; --card:#FFFFFF; --primary:#FF8A5C; --primary-dark:#F06B3C; --text:#3D2C23; --text-light:#9B8577; --border:#F3E4D6; --green:#5CB87A; }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--text); min-height:100vh; line-height:1.6; }
    .admin-wrap { max-width:560px; margin:0 auto; padding:32px 20px 60px; }
    h1 { font-size:24px; text-align:center; margin-bottom:8px; }
    .tip { text-align:center; font-size:13px; color:var(--text-light); margin-bottom:24px; }
    .search { width:100%; padding:12px 16px; border:2px solid var(--border); border-radius:14px; font-size:15px; outline:none; margin-bottom:20px; background:#fff; }
    .search:focus { border-color:var(--primary); }
    .report-card { background:var(--card); border-radius:18px; padding:20px; margin-bottom:16px; box-shadow:0 4px 14px rgba(0,0,0,0.05); }
    .rc-head { font-size:18px; font-weight:800; margin-bottom:12px; display:flex; align-items:center; gap:6px; }
    .rc-head span { font-size:12px; color:var(--primary); background:#FFF3EC; padding:2px 10px; border-radius:12px; font-weight:700; }
    .rc-body p { font-size:14px; margin-bottom:10px; }
    .rc-body b { color:var(--primary-dark); }
    .copy-btn { width:100%; padding:12px; border:none; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; background:var(--green); color:#fff; }
    .copy-btn:active { transform:scale(.98); }
    .copy-btn.done { background:#9B8577; }
  </style>
</head>
<body>
  <div class="admin-wrap">
    <h1>📋 宠格报告对照表</h1>
    <p class="tip">收到付款用户的「宠格名」后，在下面搜索、点「复制报告」，粘贴发过去即可</p>
    <input class="search" id="search" type="text" placeholder="搜索宠格名，比如：快乐小太阳">
    <div id="type-list"></div>
  </div>

  <script src="types.js"></script>
  <script>
    const list = document.getElementById('type-list');
    const search = document.getElementById('search');

    function buildReport(t) {
      return `【${t.name} ${t.emoji}】完整报告\n\n🐾 它的小世界\n${t.desc}\n\n💡 相处建议\n${t.advice}\n\n🏠 喜欢的生活环境\n${t.environment}\n\n🎾 日常偏好\n${t.preference}\n\n⚠️ 它的小雷区\n${t.dislike}\n\n🧸 适合的玩具和游戏\n${t.toys}\n\n👨‍👩‍👧 最适合它的主人\n${t.owner}`;
    }

    function render(filter) {
      const kw = (filter || '').trim();
      list.innerHTML = '';
      Object.keys(TYPES).forEach(code => {
        const t = TYPES[code];
        if (kw && !(t.name.includes(kw) || code.includes(kw.toUpperCase()))) return;
        const card = document.createElement('div');
        card.className = 'report-card';
        card.innerHTML = `
          <div class="rc-head">${t.emoji} ${t.name} <span>${code}</span></div>
          <div class="rc-body">
            <p><b>🐾 它的小世界</b><br>${t.desc}</p>
            <p><b>💡 相处建议</b><br>${t.advice}</p>
            <p><b>🏠 喜欢的生活环境</b><br>${t.environment}</p>
            <p><b>🎾 日常偏好</b><br>${t.preference}</p>
            <p><b>⚠️ 它的小雷区</b><br>${t.dislike}</p>
            <p><b>🧸 适合的玩具和游戏</b><br>${t.toys}</p>
            <p><b>👨‍👩‍👧 最适合它的主人</b><br>${t.owner}</p>
          </div>
          <button class="copy-btn" data-code="${code}">复制报告</button>`;
        list.appendChild(card);
      });

      list.querySelectorAll('.copy-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const text = buildReport(TYPES[btn.dataset.code]);
          const done = () => { btn.textContent = '✓ 已复制'; btn.classList.add('done'); setTimeout(() => { btn.textContent = '复制报告'; btn.classList.remove('done'); }, 1500); };
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(done);
          } else {
            const ta = document.createElement('textarea');
            ta.value = text; document.body.appendChild(ta); ta.select();
            document.execCommand('copy'); document.body.removeChild(ta); done();
          }
        });
      });
    }

    render();
    search.addEventListener('input', e => render(e.target.value));
  </script>
</body>
</html>
